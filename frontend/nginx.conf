# Music Studio 前端站点配置（nginx 1.27 / conf.d）
#
# 职责三件事：
# 1. 托管 Vite 打包出来的 SPA（history 路由 fallback 到 index.html）；
# 2. 把 /v1/* 反代给后端容器，让浏览器只看到同源请求（省掉 CORS 配置）；
# 3. 给带 hash 的静态资源长缓存、给 index.html 禁缓存，避免发版后白屏。
#
# backend 是 docker compose 里的服务名，Docker 内置 DNS 会解析成容器 IP。
# 如果不用 compose（例如 k8s 或手工 docker run），把 upstream 改成实际地址，
# 或给后端容器加 --network-alias backend。

upstream music_api {
    # 后端默认端口 8788（backend/app/config.py 的 MUSIC_STUDIO_PORT）。
    server backend:8788;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号；请求体上限给 2m（后端自己限 64KB，这里只做粗筛）。
    server_tokens off;
    client_max_body_size 2m;
    sendfile on;

    # 文本类资源压缩。图片/音频本身已压缩，重复压只会浪费 CPU。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/music-studio-security.conf;

    # 容器健康检查用：nginx 直接返回，不碰后端。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端 API ----
    # 注意 proxy_pass 结尾不带斜杠：/v1/xxx 原样转给后端，不做路径改写。
    location /v1/ {
        proxy_pass http://music_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 后端默认不信任这两个头（MUSIC_STUDIO_TRUST_PROXY=false）；
        # compose 里已设为 true，限流与「单客户端并发数」才能按真实 IP 统计。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /v1/llm 是同步等模型返回的接口，慢的时候几十秒；生成任务是异步的，
        # 不受这个超时影响。给足 300s，避免前端拿到 504。
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Range 不显式设置：nginx 默认会把客户端请求头（含 Range / If-Range）
        # 原样转给上游，206 分片响应也原样返回。手工 `proxy_set_header Range`
        # 反而在无 Range 的请求上发出空头，可能被上游当成非法范围。
        include /etc/nginx/snippets/music-studio-security.conf;
    }

    # ---- 带内容指纹的构建产物：一年强缓存 ----
    # Vite 产物形如 assets/index-B3x9k2.js，内容变了文件名就变，可以放心 immutable。
    # ^~ 让这个前缀优先级高于下面的正则 location，否则 assets 里的图片/字体
    # 会被正则规则抢走、退化成 7 天缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/music-studio-security.conf;
        access_log off;
    }

    # 其它静态文件（favicon、robots.txt 等）：短缓存，允许过期后回源校验。
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/music-studio-security.conf;
        access_log off;
    }

    # ---- SPA 入口：绝不缓存。否则发版后用户还拿着旧的 index.html 去加载
    # 已经不存在的 assets/xxx.js，控制台 404、页面白屏。 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/music-studio-security.conf;
    }

    location / {
        # 先找真实文件，再找目录，都没有就交给前端路由（Vue 目前是单页，
        # 以后加 vue-router 的 history 模式也不用改这里）。
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/music-studio-security.conf;
    }
}
