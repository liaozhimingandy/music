# 基础安全头（被 nginx.conf 多处 include）。
#
# 为什么单独成文件：nginx 的 add_header 是「覆盖式继承」——子 location 里只要
# 出现任何一条 add_header，父级的所有 add_header 就全部失效。缓存策略又必须
# 在 location 里配 add_header，所以把安全头抽出来 include，保证每个 location
# 都有，不会因为加了缓存规则而漏掉。
#
# always 参数：让 4xx/5xx 响应也带这些头（默认只有 2xx/3xx 才加）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 不启 CSP：Vue 的 scoped style 与 TDesign 会注入内联样式，一刀切的 CSP
# 会把样式直接打掉。需要 CSP 时按实际 inline hash 单独配。
