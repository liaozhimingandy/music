# 构建并推送镜像到 Docker Hub + 阿里云 ACR。
#
# 为什么两个仓库都推：Docker Hub 给海外/CI/公开场景用，阿里云 ACR 给国内云
# 服务器拉取用（国内拉 Docker Hub 经常超时）。服务器只需要改 .env 里的镜像
# 地址就能在两个来源之间切换，compose 文件不用动。
#
# 需要配置（Settings -> Secrets and variables -> Actions）：
#   Secrets（可选，配了才推）
#     DOCKERHUB_USERNAME   Docker Hub 用户名；**不配则整段 Docker Hub 发布跳过**
#     DOCKERHUB_PASSWORD   对应用户密码（用户密码登录，非 Access Token）
#     ALIYUN_USERNAME      阿里云容器镜像服务的账号；**不配则阿里云发布跳过**
#     ALIYUN_PASSWORD      对应密码 / 固定密码
#   Variables（或 Secrets，二者皆可；工作流会同时读取，secrets 优先）
#     DOCKERHUB_NAMESPACE  镜像命名空间，缺省用仓库 owner
#     DOCKER_PLATFORMS     目标架构，缺省 linux/amd64；ARM 服务器填 linux/amd64,linux/arm64
#     ALIYUN_REGISTRY      例：registry.cn-hangzhou.aliyuncs.com（和 ALIYUN_USERNAME 同时配才生效）
#     ALIYUN_NAMESPACE     例：your-namespace
#
# 登录策略：**只在用户名 secret 存在时才登录对应仓库**——没配用户名就整段跳过，
# 不会因缺密码而报错；对应的镜像名也只在登录成功时才拼进推送列表。两个仓库都
# 没配则跳过全部推送（仅做一次构建校验的价值有限，这里直接跳过以免空推送报错）。
#
# 关键约束：GitHub Actions 的 if 表达式里**不能直接用 secrets 上下文**（会报
# "Unrecognized named-value: 'secrets'"）。所以是否配置了仓库，先由
# "Resolve registry flags" 步骤把 secret 注入到 env，再用脚本把「是否配置」
# 写成 step output，后续步骤用 output 做 if 判断。vars 在 if 里可用，故
# 架构判断（amd64？）直接用 vars 即可。

name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/build-images.yml"
    tags: ["v*"]
  workflow_dispatch:

# 同一个分支只保留最新一次构建；tag 推送不取消（发版镜像必须完整推完）。
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # 命名空间没配时退回仓库 owner，fork 后也能直接用。
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
  DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
  # 兼容：ALIYUN_REGISTRY / ALIYUN_NAMESPACE 既可能配在 Variables 也可能配在 Secrets，
  # 这里统一从两者取（secrets 优先），避免用户放错位置导致整段跳过。
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 构建出错也要把结果暴露出来
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            # 后端镜像不接受 Vite 变量，留空（传了 buildx 会警告 unused build arg）
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ARM 目标需要 QEMU 才能在 x86 runner 上跑 arm64 的 pip/npm；
      # 只构建 amd64 时这两个步骤几乎零开销。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 把 secret 注入 env，再用脚本把「是否配置了某仓库」写成 step output。
      # 后续登录 / 推送 / 冒烟步骤都基于这个 output 判断，避免在 if 里直接用 secrets。
      - name: Resolve registry flags
        id: registry
        env:
          # 兼容：ALIYUN_* 既可放 Secrets 也可放 Variables（secrets 优先），避免用户放错位置导致整段跳过。
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY || vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || vars.ALIYUN_NAMESPACE }}
        run: |
          set -euo pipefail
          # 诊断：只打印「是否配置」，绝不打印敏感值，方便定位到底哪个变量没配/放错位置。
          echo "DOCKERHUB_USERNAME: $([ -n "${DOCKERHUB_USERNAME:-}" ] && echo set || echo EMPTY)"
          echo "ALIYUN_USERNAME:    $([ -n "${ALIYUN_USERNAME:-}" ] && echo set || echo EMPTY)"
          echo "ALIYUN_REGISTRY:    $([ -n "${ALIYUN_REGISTRY:-}" ] && echo set || echo EMPTY)"
          echo "ALIYUN_NAMESPACE:   $([ -n "${ALIYUN_NAMESPACE:-}" ] && echo set || echo EMPTY)"
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ALIYUN_USERNAME:-}" ] && [ -n "${ALIYUN_REGISTRY:-}" ] && [ -n "${ALIYUN_NAMESPACE:-}" ]; then
            echo "aliyun=true" >> "$GITHUB_OUTPUT"
          else
            echo "aliyun=false" >> "$GITHUB_OUTPUT"
          fi

      # Docker Hub：只在配了 DOCKERHUB_USERNAME 时登录，否则整段跳过。
      - name: Log in to Docker Hub
        if: ${{ steps.registry.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_PASSWORD }}

      # 阿里云：DOCKERHUB 那套独立；用户名 + 仓库地址 + 命名空间三者齐了才登录。
      - name: Log in to Aliyun ACR
        if: ${{ steps.registry.outputs.aliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || vars.ALIYUN_PASSWORD }}

      # 用脚本动态拼镜像列表：登录了哪个仓库就推哪个，没登录的绝不出现，
      # 否则会产生 "/music-studio-backend" 这种非法镜像名直接报错。
      - name: Resolve image names
        id: images
        env:
          SERVICE: music-studio-${{ matrix.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY || vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || vars.ALIYUN_NAMESPACE }}
        run: |
          set -euo pipefail
          names=""
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            names="${names}${names:+$'\n'}${DOCKERHUB_NAMESPACE}/${SERVICE}"
          fi
          if [ -n "${ALIYUN_USERNAME:-}" ] && [ -n "${ALIYUN_REGISTRY:-}" ] && [ -n "${ALIYUN_NAMESPACE:-}" ]; then
            names="${names}${names:+$'\n'}${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${SERVICE}"
          fi
          if [ -z "${names}" ]; then
            echo "::error::未配置任何镜像仓库（请设置 DOCKERHUB_USERNAME 或 ALIYUN_USERNAME + ALIYUN_REGISTRY + ALIYUN_NAMESPACE），跳过构建推送。"
            exit 1
          fi
          {
            echo "list<<IMAGES_EOF"
            echo "${names}"
            echo "IMAGES_EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "将推送："
          echo "${names}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          labels: |
            org.opencontainers.image.title=Music Studio ${{ matrix.name }}
            org.opencontainers.image.description=AI 音乐创作工作台（${{ matrix.name }}）
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # 关键：关闭 provenance/SBOM 断言。build-push-action@v6 默认开启，
          # 会额外推送一个 application/vnd.oci.empty.v1+json 断言清单，阿里云 ACR
          # 不识别该 manifest class，报
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 关掉后只推真实镜像清单，阿里云/Docker Hub 都能正常接收。
          provenance: false
          sbom: false
          # GHA 缓存按服务分 scope（目前仅 backend），不同镜像的 layer 不会互相污染。
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # 构建概述：把「推到了哪些仓库、镜像地址、本次标签」写进运行 Summary 页
      # 面，同时在日志里用 group 折叠打印，方便一眼核对推送结果。
      - name: 构建概述
        if: ${{ steps.images.outputs.list != '' }}
        env:
          DOCKERHUB_PUSHED: ${{ steps.registry.outputs.dockerhub }}
          ALIYUN_PUSHED: ${{ steps.registry.outputs.aliyun }}
          IMAGES: ${{ steps.images.outputs.list }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          dh=$([ "${DOCKERHUB_PUSHED}" = "true" ] && echo "✅ 已推送" || echo "⏭️ 跳过（未配置 DOCKERHUB_USERNAME）")
          acr=$([ "${ALIYUN_PUSHED}" = "true" ] && echo "✅ 已推送" || echo "⏭️ 跳过（未配置 ALIYUN_USERNAME/REGISTRY/NAMESPACE）")
          {
            echo "## 🐳 镜像构建概述"
            echo ""
            echo "**服务**：\`music-studio-${{ matrix.name }}\`"
            echo ""
            echo "### 推送目标仓库"
            echo "- Docker Hub：${dh}"
            echo "- 阿里云 ACR：${acr}"
            echo ""
            echo "### 镜像地址（base）"
            echo '```text'
            echo "${IMAGES}"
            echo '```'
            echo ""
            echo "### 本次标签"
            echo '```text'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::🐳 镜像构建概述"
          echo "服务        : music-studio-${{ matrix.name }}"
          echo "Docker Hub  : ${dh}"
          echo "阿里云 ACR  : ${acr}"
          echo "镜像 base   :"
          echo "${IMAGES}"
          echo "标签        :"
          echo "${TAGS}"
          echo "::endgroup::"

      # 冒烟测试：把刚推上去的后端镜像真的跑起来，确认进程能起、库能建、
      # /v1/health 能返回。镜像「构建成功」不等于「能启动」——少个系统依赖、
      # 非 root 写不了数据目录这类问题只有跑一次才会暴露。
      # 合并到 build 任务内：job 级 if 同样不能用 secrets，放在同任务里用
      # steps.registry.outputs.dockerhub 判断即可；amd64 架构判断用 vars（if 里可用）。
      - name: Smoke test backend image
        if: ${{ steps.registry.outputs.dockerhub == 'true' && contains(vars.DOCKER_PLATFORMS || 'linux/amd64', 'amd64') }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_NAMESPACE}/music-studio-backend:sha-${GITHUB_SHA:0:7}"
          echo "验证镜像：${image}"
          docker pull "${image}"
          docker rm -f music-smoke >/dev/null 2>&1 || true
          # mock 模式：不联网、不需要密钥，但建表/健康检查/静态资源路径全走真实代码。
          # 容器内监听端口固定 8000（与 backend/Dockerfile 的 CMD 一致），
          # 这里必须映射并探测同一个端口，否则冒烟测试会一直等不到就绪。
          docker run -d --name music-smoke -p 8000:8000 \
            -e MUSIC_STUDIO_MOCK=true "${image}"

          for i in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:8000/v1/health 2>/dev/null)"; then
              echo "健康检查通过：${body}"
              echo "--- 容器日志 ---"
              docker logs music-smoke
              exit 0
            fi
            sleep 2
          done

          echo "::error::后端镜像启动后 60 秒内 /v1/health 未就绪"
          echo "--- 容器状态 ---"
          docker ps -a --filter name=music-smoke
          echo "--- 容器日志 ---"
          docker logs music-smoke || true
          exit 1

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f music-smoke >/dev/null 2>&1 || true
