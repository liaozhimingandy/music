name: Deploy Frontend to GitHub Pages

# =============================================================================
# 把 frontend/ 构建成静态站点并发布到 GitHub Pages。
#
# 一次性设置：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
# 之后每次 push 到 main 且前端文件变化，或手动 workflow_dispatch，即自动构建部署。
#
# 资源基址（base）策略 —— 这里不再强制注入 VITE_BASE_PATH：
# * 自定义域名（如 https://music.openaim.cn）站点在**根路径**，base 必须是 "/"，
#   这正是 frontend/.env.production 里 VITE_BASE_PATH 的默认值，直接沿用；
# * 若部署成 GitHub Pages 项目页（https://<owner>.github.io/<repo>/），
#   在仓库 Variables 里加 PAGES_BASE_PATH=/<repo>/ 即可，workflow 会透传。
# 早期版本无条件写死 /<repo>/，导致自定义域名下 index.html 去 /<repo>/assets/*.js
# 取文件而 404（现象就是「找不到 js 文件」），现在改为默认跟随 env、按需覆盖。
#
# 说明：
# - GitHub Pages 是纯静态托管，没有 FastAPI 后端；接口地址在 .env.production 的
#   VITE_APP_API_BASE_URL（需后端开启 CORS）。
# - 无需任何 token / secret，使用官方 Pages Actions 的 OIDC 权限即可。
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # 自定义域名（Settings → Pages 里绑定的那个）。留空则不写 CNAME 文件。
  # 写进产物可以避免「每次 Actions 部署把 Settings 里的自定义域名冲掉」。
  PAGES_CUSTOM_DOMAIN: music.openaim.cn

jobs:
  build:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查与构建
        working-directory: frontend
        env:
          # 仅当仓库配置了 PAGES_BASE_PATH 变量时才覆盖 base；默认空 -> 用 .env.production 的值
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          VITE_APP_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_BASE_PATH:-}" ]; then
            unset VITE_BASE_PATH
            echo "未设置 PAGES_BASE_PATH，使用 frontend/.env.production 里的 base"
          else
            echo "使用仓库变量 PAGES_BASE_PATH=${VITE_BASE_PATH} 作为 base"
          fi
          npm run build

      - name: 校验构建产物
        working-directory: frontend
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::缺少 dist/index.html"; exit 1; }

          # 从 index.html 取入口脚本路径（/assets/index-xxx.js 或 ./assets/…），
          # 不再假设固定 base 前缀，自定义域名（/）与项目页（/repo/）都能通过。
          entry=$(grep -oE '"[^"]*assets/[A-Za-z0-9._-]+\.js"' dist/index.html | head -1 | tr -d '"' || true)
          test -n "$entry" || { echo "::error::index.html 没有引用任何 js 资源"; exit 1; }

          asset="${entry#./}"          # ./assets/x.js -> assets/x.js
          asset="${asset#/}"           # /assets/x.js  -> assets/x.js
          test -f "dist/${asset}" || { echo "::error::index.html 引用的 ${entry} 在 dist 里不存在"; exit 1; }

          # SPA 深链兜底 + 关闭 Jekyll（避免 _ 开头资源被忽略）
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          # 自定义域名：写 CNAME 到产物根目录，Actions 部署后仍保留该域名
          if [ -n "${PAGES_CUSTOM_DOMAIN:-}" ]; then
            echo "${PAGES_CUSTOM_DOMAIN}" > dist/CNAME
            echo "自定义域名: ${PAGES_CUSTOM_DOMAIN}"
          fi

          echo "入口资源: ${entry}"
          echo "产物文件数: $(find dist -type f | wc -l)"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 上传构建留档
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署概述：把「部署到哪、访问地址」写进运行 Summary 页面，并在日志中打印。
      - name: 部署概述
        if: ${{ success() }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CUSTOM_DOMAIN: ${{ env.PAGES_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          domain="${CUSTOM_DOMAIN:-（未设置）}"
          {
            echo "## 🌐 前端部署概述"
            echo ""
            echo "**部署目标**：GitHub Pages（纯静态站点，不含 FastAPI 后端）"
            echo ""
            echo "### 访问地址"
            echo "- Pages 默认地址：${PAGE_URL}"
            echo "- 自定义域名：${domain}"
            echo ""
            echo "### 说明"
            echo "- 接口地址见 frontend/.env.production 的 VITE_APP_API_BASE_URL，需后端开启 CORS。"
            echo "- 已生成 404.html 用于 SPA 深链回退，.nojekyll 防止 Jekyll 处理 _ 开头资源。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::🌐 前端部署概述"
          echo "Pages 地址  : ${PAGE_URL}"
          echo "自定义域名  : ${domain}"
          echo "::endgroup::"
