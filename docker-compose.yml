# 源码构建版编排：本地开发 / 直接在有代码的机器上跑后端。
#
#   cp deploy/.env.example .env      # 填 LLM_API_KEY、MUSIC_API_TOKEN
#   docker compose up -d --build
#   后端监听 8788；前端另走 GitHub Pages / Cloudflare，不在本编排内。
#
# 没配密钥想先看界面：MUSIC_STUDIO_MOCK=true docker compose up -d --build
# （离线演示模式，LLM 与音乐生成都走桩，不联网、不花钱）
#
# 生产环境请用 deploy/docker-compose.yml（拉镜像，不在服务器上编译）。

name: music-studio

# 所有服务统一日志轮转：json-file 不限制会吃满磁盘，尤其音乐任务刷日志时。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 本地构建用独立变量名：.env 里的 BACKEND_IMAGE 是给生产编排的仓库地址，
    # 复用同名变量会让本地镜像被意外打上 yourname/... 这样的远端 tag。
    image: ${LOCAL_BACKEND_IMAGE:-music-studio/backend:local}
    restart: unless-stopped
    # env_file 用可选写法：没有 .env 时 compose 仍能起（服务会以缺密钥状态运行，
    # 适合先验证镜像）。需要 Compose >= 2.24；更老的版本删掉 required 那一行。
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定路径，与后端镜像里 chown 过的 /app/data 保持一致；
      # 宿主机只关心命名卷，不关心它在哪个物理目录。
      MUSIC_STUDIO_DATA_DIR: /app/data
      MUSIC_STUDIO_PORT: "8788"
      # 反代（Cloudflare / 宿主 Nginx / 云 LB）会写 X-Forwarded-For，开启后
      # 限流 / 单客户端并发按真实 IP 统计。
      MUSIC_STUDIO_TRUST_PROXY: "true"
      MUSIC_STUDIO_MOCK: ${MUSIC_STUDIO_MOCK:-false}
    ports:
      # 本地开发直接访问；上云时改成 127.0.0.1:8788:8788 再经反代暴露。
      - "${BACKEND_PORT:-8788}:8788"
    volumes:
      # SQLite 库 + outputs 音频 + 阶段 JSON 全在这里，删卷 = 删全部作品。
      - music-data:/app/data
    logging: *default-logging

volumes:
  music-data:
    name: music-studio-data
