# 源码构建版编排：本地开发 / 直接在有代码的机器上跑。
#
#   cp deploy/.env.example .env      # 填 LLM_API_KEY、MUSIC_API_TOKEN
#   docker compose up -d --build
#   open http://localhost:8088
#
# 没配密钥想先看界面：MUSIC_STUDIO_MOCK=true docker compose up -d --build
# （离线演示模式，LLM 与音乐生成都走桩，不联网、不花钱）
#
# 生产环境请用 deploy/docker-compose.yml（拉镜像，不在服务器上编译）。

name: music-studio

# 所有服务统一日志轮转：json-file 不限制会吃满磁盘，尤其音乐任务刷日志时。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 本地构建用独立变量名：.env 里的 BACKEND_IMAGE 是给生产编排的仓库地址，
    # 复用同名变量会让本地镜像被意外打上 yourname/... 这样的远端 tag。
    image: ${LOCAL_BACKEND_IMAGE:-music-studio/backend:local}
    restart: unless-stopped
    # env_file 用可选写法：没有 .env 时 compose 仍能起（服务会以缺密钥状态运行，
    # 适合先验证镜像）。需要 Compose >= 2.24；更老的版本删掉 required 那一行。
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定路径，与后端镜像里 chown 过的 /app/data 保持一致；
      # 宿主机只关心命名卷，不关心它在哪个物理目录。
      MUSIC_STUDIO_DATA_DIR: /app/data
      MUSIC_STUDIO_PORT: "8788"
      # nginx 反代会写 X-Forwarded-For，开启后限流/单客户端并发按真实 IP 统计。
      # 反代不在本编排内（例如换成云 LB 直连后端）时，要确认链路会覆盖该头。
      MUSIC_STUDIO_TRUST_PROXY: "true"
      MUSIC_STUDIO_MOCK: ${MUSIC_STUDIO_MOCK:-false}
    volumes:
      # SQLite 库 + outputs 音频 + 阶段 JSON 全在这里，删卷 = 删全部作品。
      - music-data:/app/data
    # 只在内网暴露：宿主机不映射端口，外网只能经前端 nginx 的 /v1 访问。
    expose:
      - "8788"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 同源 /v1：浏览器只跟 nginx 说话，nginx 反代到 backend，天然无跨域。
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:-/v1}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_APP_IS_DEBUG: "False"
    image: ${LOCAL_FRONTEND_IMAGE:-music-studio/frontend:local}
    restart: unless-stopped
    depends_on:
      # 等后端过了健康检查再起 nginx：否则首个请求可能拿到 502，
      # 前端顶栏会短暂显示「后端未连接」。
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"
    logging: *default-logging

volumes:
  music-data:
    name: music-studio-data
