# 单服务编排：仅后端。反向代理（Traefik）已在别处运行，本文件不重复部署。
#
# 用法：
#   cd backend
#   # .env 与 docker-compose.yml 同级（backend/）时，env_file 默认指向 ./ .env，直接起即可：
#   docker compose up -d --build
#   # 若 .env 在别的路径，用 ENV_FILE 指过去：
#   ENV_FILE=/path/to/.env docker compose up -d --build
#
# 接入已有 Traefik（关键两步）：
#   1) 本服务通过 labels 暴露给 Traefik，必须和 Traefik 在同一 Docker 网络；
#   2) 本文件复用名为 proxy 的已有网络（external），如果你的 Traefik 网络名不同，
#      用 TRAEFIK_NETWORK 覆盖，例如：TRAEFIK_NETWORK=traefik_public docker compose up -d --build
#
# 路由标签（核心）：
#   traefik.enable=true                让 Traefik 接管本服务
#   traefik.http.routers.music-studio.rule=Host(...)   按域名匹配
#   traefik.http.services.music-studio.loadbalancer.server.port=8788
#                                        后端容器内固定监听端口（与 MUSIC_STUDIO_PORT 一致）
# 健康检查探 /v1/health，不健康就不转发流量。

name: music-studio-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # 本地构建用独立变量名，避免被意外打上远端 tag。
    image: ${LOCAL_BACKEND_IMAGE:-music-studio/backend:local}
    restart: unless-stopped
    # 读取同级 .env（默认当前目录 ./.env；位置不同用 ENV_FILE 覆盖）。
    # required:false 保证缺 .env 也能起（走 mock / 缺密钥状态，便于先验证镜像）。
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      # 以下为容器内固定路径 / 端口 / 代理配置，不来自 .env：
      MUSIC_STUDIO_DATA_DIR: /app/data
      MUSIC_STUDIO_PORT: "8788"
      MUSIC_STUDIO_TRUST_PROXY: "true"   # 经 Traefik 反代，开启以按真实 IP 限流
      MUSIC_STUDIO_MOCK: ${MUSIC_STUDIO_MOCK:-false}
    volumes:
      # SQLite 库 + outputs 音频 + 阶段 JSON 全在这里，删卷 = 删全部作品。
      - music-data:/app/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # 路由规则：按域名匹配。本地测试用 music.localhost；上云改成你的域名。
      - traefik.http.routers.music-studio.rule=Host(`${BACKEND_DOMAIN:-music.localhost}`)
      - traefik.http.routers.music-studio.entrypoints=web
      # 开启 HTTPS 时改用下面两行（并确认 Traefik 已配置 websecure + 证书解析器 le）：
      # - traefik.http.routers.music-studio.entrypoints=websecure
      # - traefik.http.routers.music-studio.tls.certresolver=le
      - traefik.http.routers.music-studio.service=music-studio
      # 后端容器内固定监听 8788，Traefik 把流量转给这个端口。
      - traefik.http.services.music-studio.loadbalancer.server.port=8788
      # 健康检查探 /v1/health，不健康就不转发流量。
      - traefik.http.services.music-studio.loadbalancer.healthcheck.path=/v1/health
      - traefik.http.services.music-studio.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.music-studio.loadbalancer.healthcheck.timeout=5s
    # 调试用：想直连容器（绕过 Traefik）时取消注释；正常走 Traefik 不需要。
    # ports:
    #   - "127.0.0.1:8788:8788"
    logging: *default-logging

volumes:
  music-data:

# 复用已存在的 proxy 网络（Traefik 所在网络），不在本文件创建新网络。
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
