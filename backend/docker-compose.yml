# 单服务编排：仅后端。反向代理（Traefik）已在别处运行，本文件不重复部署。
#
# 用法：
#   cd backend
#   # .env 与 docker-compose.yml 同级（backend/）时，env_file 默认指向 ./ .env，直接起即可：
#   docker compose up -d --build
#   # 若 .env 在别的路径，用 ENV_FILE 指过去：
#   ENV_FILE=/path/to/.env docker compose up -d --build
#
# 接入已有 Traefik（关键两步）：
#   1) 本服务通过 labels 暴露给 Traefik，必须和 Traefik 在同一 Docker 网络；
#   2) 本文件复用名为 traefik 的网络，如果你的 Traefik 网络名不同，
#      用 TRAEFIK_NETWORK 覆盖，例如：TRAEFIK_NETWORK=traefik_public docker compose up -d --build
#
# 端口（改端口要同步改这三处，漏一处就 502 / 探针失败）：
#   容器内监听 8000   —— 由 backend/Dockerfile 的 CMD 固定（FastAPI 官方默认）
#   宿主机映射 8000   —— 下面的 ports；前端 dev 直连 http://localhost:8000/v1
#   Traefik 转发 8000 —— 下面 labels 的 server.port，必须是**容器内**端口
#
# 健康检查：探 /v1/health，不健康就不转发流量。

name: music-studio-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    # 本地构建用独立变量名，避免被意外打上远端 tag。
    image: registry.cn-hangzhou.aliyuncs.com/liaozhiming/music-studio-backend:sha-7e158ec
    container_name: prod-oa-music-01
    restart: unless-stopped
    # 读取同级 .env（默认当前目录 ./.env；位置不同用 ENV_FILE 覆盖）。
    # required:false 保证缺 .env 也能起（走 mock / 缺密钥状态，便于先验证镜像）。
    # 宿主机端口 -> 容器端口（容器内固定 8000）。
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      # 以下为容器内固定路径 / 代理配置，不来自 .env：
      MUSIC_STUDIO_DATA_DIR: /app/data
      MUSIC_STUDIO_TRUST_PROXY: "true"   # 经 Traefik 反代，开启以按真实 IP 限流
      MUSIC_STUDIO_MOCK: ${MUSIC_STUDIO_MOCK:-false}
    volumes:
      # SQLite 库 + outputs 音频 + 阶段 JSON 全在这里，删卷 = 删全部作品。
      - music-data:/app/data
    networks:
      - proxy
    # 健康检查放在编排里而不是 Dockerfile：探针路径 / 超时 / 间隔属于部署策略，
    # 同一个镜像在不同环境（本地、预发、生产）可以有不同探针参数。
    # /v1/health 不挂限流、不碰 LLM，能真实反映「进程活着且库能打开」。
    # start-period 给 20 秒，首次建表 + 补列留足时间。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.music.rule=Host(`api-music.alsoapp.com`)"
      - "traefik.http.routers.music.entrypoints=websecure"
      - "traefik.http.routers.music.tls=true"
      - "traefik.http.routers.music.tls.certresolver=letsencrypt"
      # 必须是**容器内**实际监听的端口（即 8000），不是宿主机映射出去的端口。
      # 写错会导致 Traefik 转发到无人监听的端口 → 502。
      - "traefik.http.services.music.loadbalancer.server.port=8000"
      # 告诉 Traefik 用哪个 Docker 网络访问本容器，要与下面 networks 里的实际网络名一致。
      - "traefik.docker.network=proxy"
    logging: *default-logging

volumes:
  music-data:

# 当前是**项目私有网络**（compose 默认生成 music-studio-backend_proxy，不加 external），
# 标签里的 traefik.docker.network 已与之保持一致。
#
# 接入外部 Traefik 时改成复用 Traefik 所在网络（两处必须同时改，否则 Traefik 接不进来）：
#   networks:
#     proxy:
#       name: ${TRAEFIK_NETWORK:-traefik}
#       external: true
#   并把 TRAEFIK_NETWORK 设成真实网络名。
networks:
  proxy:
